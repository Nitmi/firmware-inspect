[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedded-firmware-inspect"
version = "0.3.0"
description = "Offline firmware identity, layout, and build comparison for embedded agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nitmi" }]
dependencies = ["pyelftools==0.33", "intelhex==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "jsonschema>=4.23"]
binary = ["pyinstaller==6.22.2"]

[project.scripts]
firmware-inspect = "firmware_inspect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firmware_inspect"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
