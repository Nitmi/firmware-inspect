name: Windows binary provenance

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  windows-x86-64:
    runs-on: windows-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7"
          python-version: "3.13.13"
          enable-cache: true
      - run: uv python install 3.13.13
      - run: uv sync --locked --extra binary --extra dev
      - name: Bind tag, version, and commit
        shell: pwsh
        run: uv run --locked --extra binary --extra dev python scripts/package_binary.py check-tag --tag $env:GITHUB_REF_NAME --json
      - name: Test
        run: uv run --locked --extra binary --extra dev pytest
      - name: Build twice and compare archives
        shell: pwsh
        run: |
          $a = Join-Path $env:RUNNER_TEMP 'firmware-release-a'
          $b = Join-Path $env:RUNNER_TEMP 'firmware-release-b'
          $wa = Join-Path $env:RUNNER_TEMP 'firmware-work-a'
          $wb = Join-Path $env:RUNNER_TEMP 'firmware-work-b'
          uv run --locked --extra binary --extra dev python scripts/package_binary.py build --output-dir $a --work-dir $wa --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --extra binary --extra dev python scripts/package_binary.py build --output-dir $b --work-dir $wb --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zipA = @(Get-ChildItem -LiteralPath $a -Filter '*.zip' -File -ErrorAction Stop)
          $zipB = @(Get-ChildItem -LiteralPath $b -Filter '*.zip' -File -ErrorAction Stop)
          if ($zipA.Count -ne 1 -or $zipB.Count -ne 1) { throw 'Expected one ZIP per build' }
          $hashA = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipA[0]).Hash
          $hashB = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipB[0]).Hash
          if ($hashA -cne $hashB) { throw 'Independent archive hashes differ' }
          uv run --locked --extra binary --extra dev python scripts/package_binary.py verify $zipA[0] --checksum "$($zipA[0].FullName).sha256" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path binary-dist -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $zipA[0].FullName -Destination binary-dist -ErrorAction Stop
          Copy-Item -LiteralPath "$($zipA[0].FullName).sha256" -Destination binary-dist -ErrorAction Stop
          "archive=$env:GITHUB_WORKSPACE\binary-dist\$($zipA[0].Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify standalone offline workflow
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract = Join-Path $env:RUNNER_TEMP 'firmware-smoke-extract'
          [IO.Compression.ZipFile]::ExtractToDirectory($env:archive, $extract)
          $exe = @(Get-ChildItem -LiteralPath $extract -Filter 'firmware-inspect.exe' -File -Recurse -ErrorAction Stop)
          if ($exe.Count -ne 1) { throw 'Expected one firmware-inspect.exe' }
          uv run --locked --extra binary --extra dev python scripts/smoke_binary.py --executable $exe[0].FullName --work-dir (Join-Path $env:RUNNER_TEMP 'firmware-smoke-inputs') --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-inspect-windows-x86_64
          path: binary-dist/*
          if-no-files-found: error
          retention-days: 14
